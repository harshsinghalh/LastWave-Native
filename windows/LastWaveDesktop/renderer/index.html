<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://127.0.0.1:* https: data: blob:; img-src 'self' https: data: blob:; media-src 'self' http://127.0.0.1:* https: blob:; connect-src 'self' http://127.0.0.1:* https:; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LastWave</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="android-parity-shell">
    <main class="app-stage">
      <section id="page" class="page"></section>
    </main>

    <div id="miniPlayer" class="mini-player hidden" role="button" tabindex="0" aria-label="Open player">
      <div class="mini-player-surface">
        <div class="mini-progress"><i id="miniProgressFill"></i></div>
        <div class="mini-content">
          <img id="playerArt" class="mini-art" alt="" />
          <div class="mini-meta">
            <strong id="playerTitle">Nothing playing</strong>
            <span id="playerArtist">Choose a song to start</span>
          </div>
          <button id="likeBtn" class="round-icon mini-like" title="Like">♡</button>
          <button id="playBtn" class="round-icon mini-play" title="Play">▶</button>
          <button id="nextBtn" class="round-icon mini-next" title="Next">▶▶</button>
        </div>
      </div>
    </div>

    <nav id="nav" class="floating-nav" aria-label="Main navigation">
      <div class="nav-dock glass-surface">
        <button data-route="feed" class="nav-item active" aria-label="Feed">
          <span class="nav-icon">⌂</span><span class="nav-label">Feed</span>
        </button>
        <button data-route="stats" class="nav-item" aria-label="Stats">
          <span class="nav-icon">▥</span><span class="nav-label">Stats</span>
        </button>
        <button data-route="playlists" class="nav-item" aria-label="Playlists">
          <span class="nav-icon">≡</span><span class="nav-label">Playlists</span>
        </button>
      </div>
      <button id="generatorFab" class="generator-fab glass-surface hidden" data-route="generator" title="Create playlist">✦</button>
    </nav>

    <div id="fullPlayer" class="full-player hidden" aria-hidden="true">
      <div id="fullPlayerBackdrop" class="full-player-backdrop"></div>
      <div class="full-player-scrim"></div>
      <div class="full-player-shell">
        <div class="full-player-top">
          <button id="collapsePlayerBtn" class="glass-icon" title="Collapse">⌄</button>
          <div class="full-player-tabs" role="tablist">
            <button data-player-tab="now" class="player-tab active">Now Playing</button>
            <button data-player-tab="lyrics" class="player-tab">Lyrics</button>
            <button data-player-tab="queue" class="player-tab">Queue</button>
          </div>
          <button id="fullMoreBtn" class="glass-icon" title="More">•••</button>
        </div>

        <div id="fullNowPlaying" class="full-tab-panel active">
          <div class="player-hero">
            <img id="fullPlayerArt" class="full-art" alt="" />
          </div>
          <div class="full-meta">
            <div>
              <h1 id="fullPlayerTitle">Nothing playing</h1>
              <button id="fullPlayerArtist" class="artist-link">Choose a song to start</button>
            </div>
            <button id="fullLikeBtn" class="glass-icon heart" title="Like">♡</button>
          </div>

          <div class="full-seek">
            <input id="seek" type="range" min="0" max="1000" value="0" />
            <div class="full-times"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
          </div>

          <div class="full-transport">
            <button id="prevBtn" class="transport-side">◀◀</button>
            <button id="fullPlayBtn" class="transport-main">▶</button>
            <button id="fullNextBtn" class="transport-side">▶▶</button>
          </div>

          <div class="full-tools">
            <button id="shuffleBtn" class="tool-button">↝<span>Shuffle</span></button>
            <button id="lyricsBtn" class="tool-button">≋<span>Lyrics</span></button>
            <button id="queueBtn" class="tool-button">≡<span>Queue</span></button>
            <button id="repeatBtn" class="tool-button">↻<span>Repeat</span></button>
            <button id="djQuickToggle" class="tool-button active">✦<span>DJ Energy</span></button>
          </div>

          <div class="full-volume">
            <span>◖</span><input id="volume" type="range" min="0" max="100" value="85" />
            <span id="djMeter" class="dj-meter"><i></i><b>0.0 dB</b></span>
            <span id="qualityBadge" class="quality-badge">AUTO</span>
          </div>
        </div>

        <div id="fullLyrics" class="full-tab-panel">
          <div class="full-panel-heading"><div><h2>Lyrics</h2><p id="lyricsSubtitle"></p></div></div>
          <div id="lyricsBody" class="full-panel-scroll"></div>
        </div>

        <div id="fullQueue" class="full-tab-panel">
          <div class="full-panel-heading"><div><h2>Queue</h2><p id="queueSubtitle"></p></div></div>
          <div id="queueBody" class="full-panel-scroll"></div>
        </div>
      </div>
    </div>

    <aside id="rightPanel" class="android-sheet hidden">
      <div class="sheet-handle"></div>
      <div class="panel-header">
        <div><strong id="rightPanelTitle">Details</strong><small id="rightPanelSubtitle"></small></div>
        <button id="closeRightPanel" class="round-icon">×</button>
      </div>
      <div id="rightPanelBody" class="panel-body"></div>
    </aside>

    <div id="connectionBadge" class="connection-badge">Starting…</div>
    <button id="backBtn" class="hidden"></button>
    <button id="forwardBtn" class="hidden"></button>
    <input id="globalSearchInput" class="hidden" />
    <div id="suggestions" class="hidden"></div>
    <button id="openSettingsBtn" class="hidden"></button>

    <audio id="audio" crossorigin="anonymous"></audio>
    <div id="contextMenu" class="context-menu hidden"></div>
    <div id="toastHost" class="toast-host"></div>
    <div id="modalHost"></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
