name: Verify released LayaWave Android runtime

on:
  push:
    branches: [laya-newtube-android]
    paths:
      - '.github/workflows/laya-runtime.yml'
      - 'tools/test_android_runtime.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download laya-preview-3 --pattern '*.apk' --dir runtime-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify startup, settings and persisted toggle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 tools/test_android_runtime.py runtime-apk/LayaWave-1.0.0-preview.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-runtime-verification
          path: runtime-verification/
