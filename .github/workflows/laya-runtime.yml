name: Verify released LayaWave Android runtime

on:
  push:
    branches: [laya-newtube-android]
    paths:
      - '.github/workflows/laya-runtime.yml'
      - 'tools/test_android_runtime.py'
  workflow_dispatch:
  workflow_run:
    workflows: [Build and publish LayaWave Android]
    types: [completed]
    branches: [laya-newtube-android]

permissions:
  contents: read

jobs:
  runtime:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Select the published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="laya-preview-${{ github.event.workflow_run.run_number }}"
          else
            TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.tag_name | startswith("laya-preview-"))][0].tag_name')
          fi
          test -n "$TAG" && test "$TAG" != "null"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          # Use the verifier belonging to this APK, rather than newer unpublished code.
          ref: ${{ steps.release.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '14742923'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Download the published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          gh release download "$TAG" --pattern '*.apk' --dir runtime-apk
          mkdir -p runtime-verification
          echo "$TAG" > runtime-verification/tested-release.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify the released APK with its matching runtime checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: python3 tools/test_android_runtime.py runtime-apk/LayaWave-1.0.0-preview.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-runtime-verification
          path: runtime-verification/
