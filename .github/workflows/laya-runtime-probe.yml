name: Laya runtime isolation
on:
  push:
    branches: [build/laya-runtime-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Pinned original and prepared models
        run: python3 tools/download_laya_model.py /tmp/laya-unsigned.onnx --keep-source /tmp/laya-original.onnx
      - name: Compile minimal diagnostic APK
        run: |
          chmod +x gradlew
          ./gradlew -p tools/laya-probe :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          emulator-options: -memory 4096 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/laya-runtime-probe.sh
      - name: Save probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Laya-runtime-probe-results
          path: |
            tools/laya-probe/app/build/reports/
            tools/laya-probe/app/build/outputs/androidTest-results/
            /tmp/laya-probe-log.txt
