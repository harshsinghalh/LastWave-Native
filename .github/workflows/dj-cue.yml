name: Laya DJ Android verification
on:
  push:
    branches: [feature/android-laya-dj-4.6.0]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dj-cue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_CERT_SHA256: 5a698e3c68c88fbeba18c3390c07771632f59ec8436308d502d6d635c0be549e
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
      RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Retrieve previously compiled release
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: LastWave-DJ-v4.6.0-Laya-APK
          run-id: 37232182953
          github-token: ${{ github.token }}
          path: previously_compiled
      - name: Retrieve passed verification reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Laya-DJ-test-reports
          run-id: 37232182953
          github-token: ${{ github.token }}
          path: previously_verified
      - name: Native DSP regression checks
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -I app/src/main/cpp tests/dj/dj_dsp_test.cpp app/src/main/cpp/DspProcessor.cpp -o /tmp/dj_test
          /tmp/dj_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -I app/src/main/cpp tests/dj/dj_highlight_test.cpp app/src/main/cpp/DspProcessor.cpp -o /tmp/dj_highlight_test
          /tmp/dj_highlight_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -I app/src/main/cpp tests/dj/dj_laya_test.cpp app/src/main/cpp/DspProcessor.cpp -o /tmp/dj_laya_test
          /tmp/dj_laya_test
      - name: Prepare build and fallback signing
        run: |
          chmod +x gradlew
          for DIR in "$HOME/.android" "$HOME/.config/.android"; do
            mkdir -p "$DIR"
            keytool -genkeypair -keystore "$DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          done
      - name: Download pinned Laya test model
        run: python3 tools/download_laya_model.py /tmp/laya-model.onnx --keep-source /tmp/laya-source.onnx
      - name: Unit tests and Android packages
        run: |
          git fetch origin c02c0af1a26c55d238eab54b7a4f87209315195c --depth=1
          if test -f previously_compiled/LastWave-DJ-v4.6.0-Laya.apk && test -z "$SIGNING_KEY$ADDON_CLIENT_SECRET" && test "$RELEASE_CERT_SHA256" = 5a698e3c68c88fbeba18c3390c07771632f59ec8436308d502d6d635c0be549e && git diff --quiet c02c0af1a26c55d238eab54b7a4f87209315195c HEAD -- app audio build.gradle.kts settings.gradle.kts gradle.properties gradle tools/generate_native_secrets.py && python3 tools/check_previous_laya_verification.py previously_verified; then
            mkdir -p app/build/outputs/apk/release
            cp previously_compiled/LastWave-DJ-v4.6.0-Laya.apk app/build/outputs/apk/release/app-release.apk
            cp -r previously_verified/reports app/build/reports
            cp -r previously_verified/outputs/androidTest-results app/build/outputs/androidTest-results
            echo 'Application and test sources are unchanged. Actual passed unit/Android reports and the compiled release are verified and reused; rerunning release installation/startup.'
            echo 'Prior passed tests: run 37232182953, application commit c02c0af1a26c55d238eab54b7a4f87209315195c. This run validates the identical release startup after fixing test-app cleanup.' > app/build/outputs/reused-verification.txt
            echo 'DJ_VERIFIED_REUSE=true' >> "$GITHUB_ENV"
          else
            ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
            echo 'DJ_VERIFIED_REUSE=false' >> "$GITHUB_ENV"
          fi
      - name: Validate release APK signature
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n1)
          test -n "$APKSIGNER"
          mkdir -p final_apk
          cp app/build/outputs/apk/release/app-release.apk final_apk/LastWave-DJ-v4.6.0-Laya.apk
          "$APKSIGNER" verify --verbose --print-certs final_apk/LastWave-DJ-v4.6.0-Laya.apk > final_apk/signature-verification.txt
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" final_apk/apksigner.jar
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          mkdir -p apk_parts
          split -b 25M -d final_apk/LastWave-DJ-v4.6.0-Laya.apk apk_parts/apk.part.
      - name: Upload APK part 1
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-APK-part-00
          path: apk_parts/apk.part.00
      - name: Upload APK part 2
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-APK-part-01
          path: apk_parts/apk.part.01
      - name: Upload APK verification tools
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-APK-tools
          path: |
            final_apk/apksigner.jar
            final_apk/signature-verification.txt
            final_apk/SHA256SUMS.txt
      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-v4.6.0-Laya-APK
          path: final_apk/
          if-no-files-found: error
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator UI and packaged JNI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -memory 4096 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/test_laya_android.sh
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Laya-DJ-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/release-startup.txt
            app/build/outputs/reused-verification.txt
