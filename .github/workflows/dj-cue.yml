          compression-level: 0
          if-no-files-found: error
      - name: Upload APK verification tools
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-APK-tools
          path: |
            final_apk/apksigner.jar
            final_apk/signature-verification.txt
            final_apk/SHA256SUMS.txt
      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-v4.7.0-Offline-Energy-APK
          path: final_apk/
          if-no-files-found: error
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator UI and packaged JNI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -memory 4096 -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/test_laya_android.sh
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Laya-DJ-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/release-startup.txt
            app/build/outputs/dj-energy-ui/
