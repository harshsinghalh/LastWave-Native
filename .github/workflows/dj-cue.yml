name: Automatic DJ Energy Android verification
on:
  push:
    branches: [feature/android-laya-dj-4.6.0]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dj-cue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE_CERT_SHA256: 5a698e3c68c88fbeba18c3390c07771632f59ec8436308d502d6d635c0be549e
      ADDON_CLIENT_SECRET: ${{ secrets.ADDON_CLIENT_SECRET }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.ALIAS || secrets.RELEASE_KEY_ALIAS || 'release_key' }}
      RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Native DSP regression checks
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -I app/src/main/cpp tests/dj/dj_dsp_test.cpp app/src/main/cpp/DspProcessor.cpp -o /tmp/dj_test
          /tmp/dj_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -I app/src/main/cpp tests/dj/dj_highlight_test.cpp app/src/main/cpp/DspProcessor.cpp -o /tmp/dj_highlight_test
          /tmp/dj_highlight_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -I app/src/main/cpp tests/dj/dj_laya_test.cpp app/src/main/cpp/DspProcessor.cpp -o /tmp/dj_laya_test
          /tmp/dj_laya_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -I app/src/main/cpp tests/dj/dj_energy_test.cpp -o /tmp/dj_energy_test
          /tmp/dj_energy_test
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pthread -I app/src/main/cpp tests/dj/dj_playback_test.cpp app/src/main/cpp/DspProcessor.cpp -o /tmp/dj_playback_test
          /tmp/dj_playback_test
      - name: Prepare build and fallback signing
        run: |
          chmod +x gradlew
          for DIR in "$HOME/.android" "$HOME/.config/.android"; do
            mkdir -p "$DIR"
            keytool -genkeypair -keystore "$DIR/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          done
      - name: Verify original 4.2.2 interface
        run: |
          git fetch --depth=1 --no-tags https://github.com/Clash-Projects/LastWave-Native.git refs/tags/4.2.2:refs/tags/lastwave-original-4.2.2
          python3 tools/verify_original_ui.py
      - name: Bundle pinned Laya model
        run: python3 tools/download_laya_model.py app/src/main/assets/laya/model.onnx
      - name: Unit tests and Android packages
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Validate release APK signature
        run: |
          python3 - <<'PYAPK'
          import hashlib, zipfile
          with zipfile.ZipFile('app/build/outputs/apk/release/app-release.apk') as apk:
              with apk.open('assets/laya/model.onnx') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == '1e8906f3ce8551f0c9e153c740505b6c99946d47db6fb69b9c87f16da7ec55d1'
              assert apk.getinfo('assets/laya/model.onnx').compress_type == zipfile.ZIP_STORED
          print('Real Laya is present in the release APK and verified.')
          PYAPK
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n1)
          test -n "$APKSIGNER"
          mkdir -p final_apk
          cp app/build/outputs/apk/release/app-release.apk final_apk/LastWave-DJ-v4.7.0-Offline-Energy.apk
          "$APKSIGNER" verify --verbose --print-certs final_apk/LastWave-DJ-v4.7.0-Offline-Energy.apk > final_apk/signature-verification.txt
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" final_apk/apksigner.jar
          (cd final_apk && sha256sum *.apk > SHA256SUMS.txt)
          test "$(stat -c%s final_apk/LastWave-DJ-v4.7.0-Offline-Energy.apk)" -lt 524288000
          mkdir -p apk_parts
          split -b 25M -d final_apk/LastWave-DJ-v4.7.0-Offline-Energy.apk apk_parts/apk.part.
      - name: Upload APK part 00
        if: ${{ hashFiles('apk_parts/apk.part.00') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-APK-part-00
          path: apk_parts/apk.part.00
          compression-level: 0
          if-no-files-found: error
      - name: Upload APK part 01
        if: ${{ hashFiles('apk_parts/apk.part.01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-APK-part-01
          path: apk_parts/apk.part.01
          compression-level: 0
          if-no-files-found: error
      - name: Upload APK part 02
        if: ${{ hashFiles('apk_parts/apk.part.02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-APK-part-02
          path: apk_parts/apk.part.02
          compression-level: 0
          if-no-files-found: error
      - name: Upload APK part 03
        if: ${{ hashFiles('apk_parts/apk.part.03') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-APK-part-03
          path: apk_parts/apk.part.03
          compression-level: 0
          if-no-files-found: error
      - name: Upload APK part 04
        if: ${{ hashFiles('apk_parts/apk.part.04') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-APK-part-04
          path: apk_parts/apk.part.04
          compression-level: 0
          if-no-files-found: error
      - name: Upload APK part 05
        if: ${{ hashFiles('apk_parts/apk.part.05') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-DJ-APK-part-05
          path: apk_parts/apk.part.05
          compression-level: 0
          if-no-files-found: error
      - name: Upload APK part 06
