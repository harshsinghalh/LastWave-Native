name: Build Android-Parity Windows App

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'windows/LastWaveDesktop/**'
      - 'tools/generate_laya_profile.py'
      - 'personalization/**'
      - '.github/workflows/windows.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'windows/LastWaveDesktop/**'
      - 'tools/generate_laya_profile.py'
      - 'personalization/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-full:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/LastWaveDesktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python for Laya
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Personal DJ profile with Laya
        shell: pwsh
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install "laya==0.3.4"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Laya install failed; generator will use the pinned safe fallback."
          }
          python tools/generate_laya_profile.py --use-laya
          Copy-Item personalization/generated_profile.json windows/LastWaveDesktop/resources/generated_profile.json -Force
          Get-Content windows/LastWaveDesktop/resources/generated_profile.json

      - name: Copy Android bundled font into Windows renderer
        shell: pwsh
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force windows/LastWaveDesktop/renderer/fonts | Out-Null
          Copy-Item app/src/main/res/font/google_sans_flex.ttf windows/LastWaveDesktop/renderer/fonts/google_sans_flex.ttf -Force
          if (-not (Test-Path windows/LastWaveDesktop/renderer/fonts/google_sans_flex.ttf)) { throw 'Google Sans Flex parity font copy failed' }

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        shell: pwsh
        run: |
          $files = @(
            'main.mjs',
            'preload.mjs',
            'services/store.mjs',
            'services/ytmusic.mjs',
            'services/lastfm.mjs',
            'services/browserstream.mjs',
            'services/potoken.mjs',
            'renderer/app.js',
            'renderer/android-parity.js',
            'tests/smoke.mjs',
            'tests/ui-parity-smoke.mjs',
            'tests/network-smoke.mjs'
          )
          foreach ($file in $files) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { throw "Syntax check failed: $file" }
          }

      - name: Run full desktop smoke tests
        run: npm run test:smoke

      - name: Verify Android UI source parity contracts
        run: node tests/ui-parity-smoke.mjs

      - name: Run live desktop playback smoke test
        timeout-minutes: 4
        env:
          LASTWAVE_NETWORK_SMOKE: '1'
        run: npx electron . --network-smoke

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Verify packaged Windows app
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter 'LastWave-Setup-4.5.0-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'LastWave installer was not produced' }
          $appExe = Get-ChildItem dist/win-unpacked -Filter 'LastWave.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appExe) { throw 'Packaged LastWave.exe was not produced' }
          Get-Item $installer.FullName | Format-List Name,Length,VersionInfo
          Get-Item $appExe.FullName | Format-List Name,Length,VersionInfo
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
          Get-FileHash $appExe.FullName -Algorithm SHA256 | Format-List
          Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/LastWave-Windows-Portable-4.5.0.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Windows-Android-Parity-v4.5.0
          path: |
            windows/LastWaveDesktop/dist/LastWave-Setup-4.5.0-x64.exe
            windows/LastWaveDesktop/dist/LastWave-Windows-Portable-4.5.0.zip
            windows/LastWaveDesktop/resources/generated_profile.json
            windows/LastWaveDesktop/tests/network-smoke-report.json
          if-no-files-found: error

      - name: Publish full Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentMain = (git ls-remote origin refs/heads/main).Split([char]9)[0]
          if ($currentMain -ne $env:GITHUB_SHA) {
            Write-Host 'A newer main commit exists; skipping stale release publication.'
            exit 0
          }
          $tag = 'v4.5.0'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'LastWave v4.5.0 - Android UI Parity for Windows' --notes 'Windows 11 release rebuilt from the Android Compose UI contracts instead of a desktop reinterpretation. Preserves the Android Feed/Statistics/Playlist root tabs, expressive headers, grouped Material 3 surfaces, floating navigation dock, mini-player/full-player, Lyrics/Queue, pushed-screen navigation, responsive 600/840dp breakpoints, Google Sans Flex, and the existing LastWave services including YouTube Music, Last.fm, downloads/imports, and Laya-personalized DJ Energy.'
          }
          gh release upload $tag windows/LastWaveDesktop/dist/LastWave-Setup-4.5.0-x64.exe windows/LastWaveDesktop/dist/LastWave-Windows-Portable-4.5.0.zip windows/LastWaveDesktop/resources/generated_profile.json --clobber
