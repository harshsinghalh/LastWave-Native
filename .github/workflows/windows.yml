name: Build Full Windows App

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'windows/LastWaveDesktop/**'
      - 'tools/generate_laya_profile.py'
      - 'personalization/**'
      - '.github/workflows/windows.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'windows/LastWaveDesktop/**'
      - 'tools/generate_laya_profile.py'
      - 'personalization/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-full:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/LastWaveDesktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: windows/LastWaveDesktop/package.json

      - name: Setup Python for Laya
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Personal DJ profile with Laya
        shell: pwsh
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install "laya==0.3.4"
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Laya install failed; generator will use the pinned safe fallback."
          }
          python tools/generate_laya_profile.py --use-laya
          Copy-Item personalization/generated_profile.json windows/LastWaveDesktop/resources/generated_profile.json -Force
          Get-Content windows/LastWaveDesktop/resources/generated_profile.json

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Syntax checks
        shell: pwsh
        run: |
          node --check main.mjs
          node --check preload.mjs
          node --check services/store.mjs
          node --check services/ytmusic.mjs
          node --check services/lastfm.mjs
          node --check renderer/app.js
          node --check tests/smoke.mjs

      - name: Run full desktop smoke tests
        run: npm run test:smoke

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Verify packaged Windows app
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter 'LastWave-Setup-4.4.0-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'LastWave installer was not produced' }
          $appExe = Get-ChildItem dist/win-unpacked -Filter 'LastWave.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $appExe) { throw 'Packaged LastWave.exe was not produced' }
          Get-Item $installer.FullName | Format-List Name,Length,VersionInfo
          Get-Item $appExe.FullName | Format-List Name,Length,VersionInfo
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List
          Get-FileHash $appExe.FullName -Algorithm SHA256 | Format-List
          Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/LastWave-Windows-Portable-4.4.0.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Windows-Full-v4.4.0
          path: |
            windows/LastWaveDesktop/dist/LastWave-Setup-4.4.0-x64.exe
            windows/LastWaveDesktop/dist/LastWave-Windows-Portable-4.4.0.zip
            windows/LastWaveDesktop/resources/generated_profile.json
          if-no-files-found: error

      - name: Publish full Windows release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentMain = (git ls-remote origin refs/heads/main).Split([char]9)[0]
          if ($currentMain -ne $env:GITHUB_SHA) {
            Write-Host 'A newer main commit exists; skipping stale release publication.'
            exit 0
          }
          $tag = 'v4.4.0'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'LastWave v4.4.0 - Full Windows Desktop App' --notes 'Full Windows 11 LastWave desktop client. Includes YouTube Music feed/search/playback, playlists/library, smart generator, genres/discovery, synced lyrics, downloads, Last.fm friends/scrobbling, imports/backups/settings, Windows media-session controls, and the Laya-personalized predictive DJ Energy mode. Android remains available from v4.3.0.'
          }
          gh release upload $tag windows/LastWaveDesktop/dist/LastWave-Setup-4.4.0-x64.exe windows/LastWaveDesktop/dist/LastWave-Windows-Portable-4.4.0.zip windows/LastWaveDesktop/resources/generated_profile.json --clobber
